name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Permite lanzarlo a mano: útil para comprobar un arreglo sin tener que empujar
  # un commit de relleno.
  workflow_dispatch:

jobs:
  rust-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Tests del core
        run: cargo test -p forge-core
      - name: Clippy
        run: cargo clippy -p forge-core -- -D warnings
      - name: CLI
        run: |
          cargo build -p forge-cli
          ./target/debug/forge dump debian /tmp/forge-ci-check iso

  server-rs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/server-rs
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/server-rs
      - name: Tests
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  web-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/web-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Trunk
        uses: jetli/trunk-action@v0.5.0
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/web-ui
      - name: Check (wasm)
        run: rustup target add wasm32-unknown-unknown && cargo check --target wasm32-unknown-unknown
      - name: Build release
        run: trunk build --release
      - name: wasm-opt (binaryen)
        run: |
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz | tar xz
          WASMOPT=$(find . -name wasm-opt -type f | head -n1)
          WASM=$(ls dist/*.wasm | head -n1)
          "$WASMOPT" -O3 --enable-bulk-memory "$WASM" -o "$WASM.opt"
          mv "$WASM.opt" "$WASM"
          ls -la dist/

  # Pruebas de interfaz con navegador real: cargan la app construida (WASM
  # incluido) y comprueban lo que un usuario ve y pulsa. Hasta ahora la UI solo se
  # compilaba, así que un fallo como la ventana en blanco no lo detectaba nada.
  ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Target wasm32
        run: rustup target add wasm32-unknown-unknown
      - name: Trunk
        uses: jetli/trunk-action@v0.5.0
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/web-ui
      - name: Interfaz servida en la raíz (como en la imagen y el túnel)
        working-directory: rust/web-ui
        run: trunk build --release --public-url /
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Playwright
        working-directory: tests/ui
        run: npm ci && npx playwright install --with-deps chromium
      - name: Pruebas de interfaz
        working-directory: tests/ui
        env:
          UI_DIST: ${{ github.workspace }}/rust/web-ui/dist
          UI_PORT: "4173"
        run: npx playwright test
      - name: Capturas y trazas si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: tests/ui/test-results
          if-no-files-found: ignore