name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Dependencias
        run: npm ci
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Tests del core
        run: cargo test -p forge-core
        working-directory: rust
      - name: Clippy
        run: cargo clippy -p forge-core -- -D warnings
        working-directory: rust
      - name: CLI
        run: |
          cargo build -p forge-cli
          ./target/debug/forge dump debian /tmp/forge-ci-check iso
        working-directory: rust

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Dependencias
        run: npm install
      - name: Tipos
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
