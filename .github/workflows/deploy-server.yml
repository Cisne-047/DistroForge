name: deploy-server

# Despliega el backend en Fly.io si el repositorio tiene el secreto
# FLY_API_TOKEN. Sin ese secreto el workflow no hace nada: no falla ni avisa,
# simplemente informa de qué falta. Así el despliegue no depende de que nadie
# tenga que pasar credenciales por el chat.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fly:
    runs-on: ubuntu-latest
    # El token NO va como env del job: solo lo recibe el step que despliega, no
    # las acciones de terceros (checkout, trunk…).
    env:
      HAS_FLY: ${{ secrets.FLY_API_TOKEN != '' }}

    steps:
      - name: Sin FLY_API_TOKEN no hay nada que hacer
        if: env.HAS_FLY == 'false'
        run: |
          echo "::notice::No hay secreto FLY_API_TOKEN; se omite el despliegue."
          echo "Para activarlo: crea la app (fly launch), el volumen (fly volumes create df_data --size 1)"
          echo "y guarda el token en Settings → Secrets and variables → Actions como FLY_API_TOKEN."
          echo "Guía completa: docs/DESPLIEGUE.md"

      - name: Checkout
        if: env.HAS_FLY == 'true'
        uses: actions/checkout@v4

      - name: Toolchain
        if: env.HAS_FLY == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Target wasm32
        if: env.HAS_FLY == 'true'
        run: rustup target add wasm32-unknown-unknown

      - name: Trunk
        if: env.HAS_FLY == 'true'
        uses: jetli/trunk-action@v0.5.0

      - name: Interfaz
        if: env.HAS_FLY == 'true'
        working-directory: rust/web-ui
        run: trunk build --release --public-url /

      - name: flyctl
        if: env.HAS_FLY == 'true'
        # Pinneado a un commit (antes @master): una acción de terceros no debe
        # poder cambiar bajo nuestros pies.
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Desplegar
        if: env.HAS_FLY == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        # el contexto es la raíz porque la imagen incluye la interfaz compilada
        run: flyctl deploy . --config rust/server-rs/fly.toml --remote-only

      - name: Comprobar que responde
        if: env.HAS_FLY == 'true'
        run: |
          APP=$(grep -m1 '^app' rust/server-rs/fly.toml | cut -d'"' -f2)
          echo "app: $APP"
          for i in $(seq 1 20); do
            if curl -fsS "https://$APP.fly.dev/api/health"; then
              echo; echo "backend en pie"; exit 0
            fi
            sleep 6
          done
          echo "::error::el backend no responde en /api/health"
          exit 1
