name: deploy
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Target wasm
        run: rustup target add wasm32-unknown-unknown
      - name: Trunk
        uses: jetli/trunk-action@v0.5.0
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/web-ui
      - name: Build de la UI Rust
        working-directory: rust/web-ui
        # URL del backend por defecto, tomada de una variable del repositorio
        # (Settings → Variables). Si está vacía, la app usa su propio origen.
        env:
          DISTROFORGE_SERVER_URL: ${{ vars.DISTROFORGE_SERVER_URL }}
        run: |
          for intento in 1 2 3; do             rm -rf dist .stage             if trunk build --release; then exit 0; fi             echo "::warning::intento $intento de la interfaz fallido; se reintenta"             sleep 10           done           echo "::error::la interfaz no se construyo tras 3 intentos"           exit 1
      - name: wasm-opt (binaryen)
        run: |
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz | tar xz
          WASMOPT=$(find . -name wasm-opt -type f | head -n1)
          WASM=$(ls rust/web-ui/dist/*.wasm | head -n1)
          "$WASMOPT" -O3 --enable-bulk-memory "$WASM" -o "$WASM.opt"
          mv "$WASM.opt" "$WASM"
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: rust/web-ui/dist
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
