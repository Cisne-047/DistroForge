name: iso-build

# Hornea una ISO de verdad, de principio a fin, y la comprueba.
#
# Hasta ahora solo se verificaba la receta: los 77 tests del núcleo generan los
# ficheros y validan los workflows como YAML, pero ninguna ISO se construía. Este
# workflow cierra ese hueco: genera el proyecto con el CLI, construye la imagen
# con live-build (la misma receta que genera DistroForge), comprueba que es una
# ISO arrancable, que **arranca en QEMU** y que dentro está lo configurado.
#
# Es lento (descarga la base de Debian y construye), así que no corre en cada
# push: solo al publicar un tag o a mano.

on:
  # Solo a mano: se depura fuera de GitHub (en un sandbox) y se lanza cuando ya
  # funciona. Cada intento fallido le manda un aviso al dueño del repositorio, así
  # que no se usa CI como banco de pruebas.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iso-build
  cancel-in-progress: true

jobs:
  debian-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: debian:bookworm
      # `lb build` monta /proc y /dev/pts dentro del chroot: sin privilegios falla
      # con "mount: permission denied". El workflow que genera DistroForge para
      # live-build tenía el mismo fallo (ya corregido en el núcleo).
      options: --privileged
    steps:
      - name: Prerrequisitos
        run: |
          apt-get update
          # build-essential: el contenedor no trae `cc` y los build scripts de
          # proc-macro (serde) lo necesitan para enlazar.
          apt-get install -y --no-install-recommends \
            curl ca-certificates git file build-essential pkg-config gh

      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Generar el proyecto (Debian, ISO, sin escritorio)
        working-directory: rust
        run: |
          cat > /tmp/cfg.json <<'JSON'
          {
            "name": "ci-iso",
            "base": "debian",
            "desktop": "none",
            "output": "iso",
            "arch": "x86_64",
            "system": { "hostname": "ci-iso", "username": "ci" },
            "grub": { "extraParams": "quiet splash console=ttyS0,115200" },
            "smokeTest": true
          }
          JSON
          cargo run -q -p forge-cli -- dump debian /tmp/proj iso /tmp/cfg.json
          find /tmp/proj -type f | sort

      - name: Construir la ISO
        run: |
          apt-get install -y --no-install-recommends \
            live-build debootstrap squashfs-tools xorriso isolinux syslinux-efi mtools dosfstools
          cd /tmp/proj/livebuild
          chmod +x auto/* config/hooks/* 2>/dev/null || true
          lb config
          # sin `time`: el shell del contenedor es dash y no lo tiene
          start=$(date +%s)
          lb build
          echo "construccion: $(( $(date +%s) - start ))s"
          ls -lh *.iso

      - name: Verificar que es una ISO arrancable
        run: |
          apt-get install -y --no-install-recommends genisoimage
          ISO=$(find /tmp/proj -name '*.iso' | head -n1)
          [ -n "$ISO" ] || { echo "no se generó ninguna ISO"; exit 1; }
          echo "ISO: $ISO ($(du -h "$ISO" | cut -f1))"
          file "$ISO" | grep -qi 'ISO 9660' || { echo "no es una ISO 9660"; exit 1; }
          isoinfo -d -i "$ISO" | grep -iE 'Volume id|El Torito|Bootable' || true
          isoinfo -d -i "$ISO" | grep -qi 'El Torito' || { echo "sin registro de arranque (El Torito)"; exit 1; }
          # la receta tiene que estar dentro: hostname y MOTD configurados
          SQ=$(isoinfo -f -i "$ISO" | grep -i 'filesystem.squashfs' | head -n1)
          [ -n "$SQ" ] || { echo "la ISO no lleva sistema de ficheros live"; exit 1; }
          echo "squashfs: $SQ"

      - name: El contenido es el que se configuró
        run: |
          apt-get install -y --no-install-recommends squashfs-tools
          ISO=$(find /tmp/proj -name '*.iso' | head -n1)
          mkdir -p /tmp/iso && (isoinfo -x "$(isoinfo -f -i "$ISO" | grep -i 'filesystem.squashfs' | head -n1)" -i "$ISO" > /tmp/fs.squashfs) 2>/dev/null || true
          [ -s /tmp/fs.squashfs ] || { echo "no pude extraer el squashfs"; exit 1; }
          echo "--- hostname dentro de la imagen ---"
          HOST=$(unsquashfs -cat /tmp/fs.squashfs etc/hostname 2>/dev/null | tr -d '\n')
          echo "hostname: [$HOST]"
          [ "$HOST" = "ci-iso" ] || { echo "el hostname configurado no llegó a la imagen"; exit 1; }
          echo "--- MOTD ---"
          unsquashfs -cat /tmp/fs.squashfs etc/motd 2>/dev/null | head -5 || true

      - name: Arrancarla en QEMU (la prueba de verdad)
        run: |
          apt-get install -y --no-install-recommends qemu-system-x86 netpbm socat
          ISO=$(find /tmp/proj -name '*.iso' | head -n1)
          mkdir -p /tmp/shots
          # Se arranca y se mira la PANTALLA, no el puerto serie: el arranque live
          # va con `quiet splash` y no levanta consola serie, así que el log sale
          # vacío aunque el sistema arranque perfectamente (comprobado a mano).
          qemu-system-x86_64 -m 2048 -no-reboot -display none \
            -cdrom "$ISO" -monitor unix:/tmp/shots/mon,server,nowait &
          QPID=$!
          sleep 120
          echo "screendump /tmp/shots/boot.ppm" | socat - UNIX-CONNECT:/tmp/shots/mon
          sleep 3
          kill $QPID 2>/dev/null || true
          ls -lh /tmp/shots/boot.ppm || { echo "::error::QEMU no dio ninguna pantalla"; exit 1; }
          pnmtopng /tmp/shots/boot.ppm > /tmp/shots/boot.png || true
          # un menú de arranque tiene cientos de valores distintos; una pantalla en
          # negro, un puñado
          variacion=$(pnmscale -width 40 /tmp/shots/boot.ppm | tail -n +4 | od -An -tu1 | tr -s ' ' '\n' | grep -v '^$' | sort -u | wc -l)
          echo "variación de la pantalla de arranque: $variacion"
          # una pantalla en negro da 2-4 valores distintos; el menú, decenas. El
          # umbral deja margen para no fallar por una captura tomada en un momento
          # con la pantalla casi uniforme (en CI se midió 26 y en local 196).
          [ "$variacion" -gt 10 ] || { echo "::error::pantalla en negro: la ISO no arranca"; exit 1; }
          echo "LA ISO ARRANCA: el menú de arranque se dibuja en pantalla"

      - name: Guardar la ISO y el log de arranque
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distroforge-debian-iso
          path: |
            /tmp/proj/livebuild/*.iso
            /tmp/shots/boot.png
          if-no-files-found: warn
          retention-days: 14

      - name: Adjuntar la ISO a la release (solo al lanzar sobre un tag)
        if: always() && startsWith(github.ref, 'refs/tags/')
        # El job corre dentro de debian:bookworm, donde el shell por defecto es
        # `sh` y no existen `shopt` ni los arrays: sin esto el step moría con 127.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sin GH_REPO, `gh` resuelve el repositorio llamando a `git` sobre el
          # workspace, que en el contenedor pertenece a otro UID y git lo rechaza
          # ("dubious ownership"). Con GH_REPO no hay que adivinar nada.
          GH_REPO: ${{ github.repository }}
        run: |
          # El workspace lo creó otro UID (el runner), así que git se queja al
          # mirarlo desde el contenedor; no afecta a la subida, pero calla el ruido.
          git config --global --add safe.directory "$GITHUB_WORKSPACE" 2>/dev/null || true
          # La ISO ya está validada (El Torito, contenido y arranque en QEMU);
          # adjuntarla a la release la hace descargable como el resto de paquetes.
          shopt -s nullglob
          isos=(/tmp/proj/livebuild/*.iso)
          if [ ${#isos[@]} -eq 0 ]; then
            echo "::warning::no hay ISO que adjuntar"
            exit 0
          fi
          sha256sum "${isos[0]}" | awk '{print $1}' > "${isos[0]}.sha256"
          # Nombre acorde a los paquetes (DistroForge_1.1.0_amd64.deb, ...): el
          # de live-build es genérico y no dice de qué versión es.
          nombre="DistroForge-${GITHUB_REF_NAME#v}-amd64.iso"
          cp "${isos[0]}" "/tmp/$nombre"
          sha256sum "/tmp/$nombre" | awk '{print $1}' > "/tmp/$nombre.sha256"
          gh release upload "$GITHUB_REF_NAME" "/tmp/$nombre" "/tmp/$nombre.sha256" --clobber
