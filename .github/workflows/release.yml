name: release

# Publica la app de escritorio: al empujar un tag v* crea la GitHub Release con
# los paquetes de Linux (.deb/.rpm/.AppImage) y Windows (.msi/.exe). Con
# workflow_dispatch solo construye y sube artefactos, sin publicar nada: así se
# puede verificar el empaquetado sin cortar una versión.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: paquetes (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    # Ningún empaquetado real (en frío) pasa de ~35 min; el tope evita que un
    # cuelgue se coma el timeout de 6 h por defecto.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Linux: deb + rpm + appimage. Windows: msi + nsis.
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependencias de Tauri (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # rpm: el empaquetador de .rpm invoca rpmbuild; patchelf lo usa el
          # bundler para reescribir los binarios antes de empaquetar.
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Target wasm32
        run: rustup target add wasm32-unknown-unknown

      - name: Trunk
        uses: jetli/trunk-action@v0.5.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/tauri-app/src-tauri

      - name: Cache de la CLI de Tauri
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-${{ runner.os }}-v2

      - name: Instalar Tauri CLI
        shell: bash
        run: |
          # La caché guarda el binario, pero `cargo install` recompila la CLI
          # aunque ya exista: en el run 38783927835 tardó 11m45s en Linux y
          # 19m26s en Windows. Solo instalamos si el binario cacheado no
          # arranca; si falta o está corrupto, se cae al `cargo install`.
          if cargo tauri --version >/dev/null 2>&1; then
            echo "cargo-tauri ya disponible: $(cargo tauri --version)"
          else
            cargo install tauri-cli --version '^2' --locked
          fi

      # La UI se compila aquí y no en `beforeBuildCommand`: los hooks de Tauri
      # se ejecutan desde la raíz del proyecto (rust/tauri-app), no desde
      # src-tauri, así que una ruta relativa `../../web-ui` no resuelve.
      #
      # `--public-url /` es obligatorio en el escritorio: `rust/web-ui/Trunk.toml`
      # fija `/DistroForge/` para GitHub Pages, y dentro del WebView de Tauri
      # esos assets absolutos no existen (ventana en blanco).
      - name: UI (Trunk)
        working-directory: rust/web-ui
        run: trunk build --release --public-url /

      - name: Empaquetar (deb + rpm)
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: rust/tauri-app/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: cargo tauri build --bundles deb,rpm

      # Los .deb/.rpm se suben antes de intentar el AppImage: así un fallo del
      # AppImage no tira a la basura los paquetes ya construidos.
      - name: Subir paquetes Linux (deb + rpm)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: distroforge-linux-deb-rpm
          path: |
            rust/tauri-app/src-tauri/target/release/bundle/deb/*.deb
            rust/tauri-app/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

      - name: Empaquetar (AppImage)
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: rust/tauri-app/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          # El bundler de AppImage descarga linuxdeploy y AppRun de GitHub
          # Releases en tiempo de empaquetado. Un 504 del CDN tumbaba el job
          # entero (run 38783927835), así que reintentamos con espera.
          for intento in 1 2 3; do
            if cargo tauri build --bundles appimage; then
              echo "AppImage generado en el intento $intento"
              exit 0
            fi
            echo "::warning::el intento $intento de AppImage ha fallado"
            sleep 20
          done
          echo "::error::AppImage falló en los 3 intentos"
          exit 1

      - name: Subir paquete Linux (AppImage)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: distroforge-linux-appimage
          path: rust/tauri-app/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Empaquetar (msi + nsis)
        if: matrix.platform == 'windows-latest'
        working-directory: rust/tauri-app/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: cargo tauri build --bundles msi,nsis

      - name: Subir paquetes Windows (msi + nsis)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: distroforge-windows-msi-nsis
          path: |
            rust/tauri-app/src-tauri/target/release/bundle/msi/*.msi
            rust/tauri-app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Firmas del updater (.sig): sin ellas la auto-actualización no puede
      # verificar el paquete. Se suben aparte y sin exigirlas, para que un fallo
      # aquí no tumbe los paquetes ya construidos.
      - name: Subir firmas del updater
        uses: actions/upload-artifact@v4
        with:
          # nombre único por plataforma: con el mismo nombre en los dos jobs, uno
          # de los dos conjuntos de firmas se perdía al descargar los artefactos
          name: distroforge-updater-signatures-${{ matrix.platform }}
          path: |
            rust/tauri-app/src-tauri/target/release/bundle/appimage/*.sig
            rust/tauri-app/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: warn

  publish:
    name: publicar release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar paquetes
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Crear la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `download-artifact` con `merge-multiple` deja los paquetes en
          # subcarpetas (dist/deb/, dist/rpm/, dist/appimage/, dist/msi/,
          # dist/nsis/), así que `dist/**` expandía a DIRECTORIOS y
          # `gh release create` espera ficheros. Listamos los ficheros reales,
          # sea cual sea el anidamiento que deje la descarga.
          mapfile -t paquetes < <(find dist -type f | sort)
          if [ "${#paquetes[@]}" -eq 0 ]; then
            echo "::error::no hay paquetes que publicar en dist/"
            exit 1
          fi
          printf 'Adjuntando %d paquetes:\n' "${#paquetes[@]}"
          printf '  %s\n' "${paquetes[@]}"
          # Idempotente: un reintento del job no debe morir porque la release ya
          # existe (pasó al reintentar el 17/10).
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber "${paquetes[@]}"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "DistroForge $GITHUB_REF_NAME" \
              --generate-notes \
              "${paquetes[@]}"
          fi
      # Auto-actualización: el manifiesto que consulta la app al arrancar. El
      # release vive en un repositorio privado y la app no puede leerlo, así que el
      # manifiesto y los paquetes se publican en el host público que ya sirve el
      # backend (el sandbox), bajo /updates.
      - name: Publicar el manifiesto de actualizaciones
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          INSTABOX_API_URL: https://api.instabox.sh
          SB: distroforge-docker
          BASE: https://8080-agquomtcvruyqlfzbgdq6adiie.instabox.tech/updates/
        run: |
          set -euo pipefail
          if [ -z "${INSTABOX_API_KEY:-}" ]; then
            echo "::notice::sin INSTABOX_API_KEY no hay dónde publicar el manifiesto; se omite"
            exit 0
          fi
          command -v instabox >/dev/null 2>&1 || curl -fsSL https://instabox.sh/install.sh | env INSTABOX_INSTALL_DIR="$HOME/.local/bin" sh
          export PATH="$HOME/.local/bin:$PATH"

          python3 - <<'PY'
          import datetime, glob, json, os
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          base = os.environ["BASE"]
          plataformas = {}
          def firma(p):
              return open(p, encoding="utf-8").read().strip()
          for pat, clave in (("dist/**/*-setup.exe", "windows-x86_64"), ("dist/**/*.AppImage.tar.gz", "linux-x86_64"), ("dist/**/*.AppImage", "linux-x86_64")):
              for fichero in glob.glob(pat, recursive=True):
                  s = fichero + ".sig"
                  if os.path.exists(s):
                      plataformas[clave] = {"signature": firma(s), "url": base + os.path.basename(fichero)}
          if not plataformas:
              raise SystemExit("no hay paquetes firmados: revisa que el secreto TAURI_SIGNING_PRIVATE_KEY exista")
          doc = {
              "version": version,
              "notes": f"DistroForge {version}",
              "pub_date": datetime.datetime.now(datetime.UTC).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": plataformas,
          }
          open("/tmp/latest.json", "w", encoding="utf-8").write(json.dumps(doc, indent=2))
          print("manifiesto:", json.dumps(doc)[:200])
          PY

          instabox exec "$SB" -- 'docker exec df mkdir -p /app/web/updates'
          base64 -w0 /tmp/latest.json | instabox exec "$SB" --stdin -- 'base64 -d > /tmp/latest.json && docker cp /tmp/latest.json df:/app/web/updates/latest.json && echo manifiesto publicado'

          # Los paquetes los descarga el propio sandbox con un token de un solo uso
          # (evita mover decenas de MB por la CLI).
          for fichero in $(find dist -type f \( -name '*-setup.exe' -o -name '*.AppImage.tar.gz' -o -name '*.AppImage' \) | sort); do
            nombre=$(basename "$fichero")
            url=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq ".assets[] | select(.name==\"$nombre\") | .url")
            echo "-> $nombre  ($url)"
            if [ -z "$url" ]; then echo "::warning::$nombre no está en el release"; continue; fi
            instabox exec "$SB" --env GH_TOKEN="$GH_TOKEN" -- "curl -fsSL -H 'Authorization: Bearer \$GH_TOKEN' -H 'Accept: application/octet-stream' -L -o /tmp/$nombre '$url' && docker cp /tmp/$nombre df:/app/web/updates/$nombre && echo subido $nombre"
          done
          echo "actualizaciones publicadas en ${BASE}latest.json"