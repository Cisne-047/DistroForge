name: server-image

# Publica la imagen del backend en GitHub Container Registry, que es lo que
# consumen los despliegues (Fly.io, Render, un VPS con docker compose…).
# :latest en main y :sha-<corto> en cada build; :vX.Y.Z al empujar un tag.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "rust/server-rs/**"
      - ".github/workflows/server-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # La imagen incluye la interfaz, así que se compila antes: el contenedor
      # sirve la app y la API en el mismo origen (cookie de sesión).
      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Target wasm32
        run: rustup target add wasm32-unknown-unknown

      - name: Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          # trunk 0.19 instalaba Binaryen 116, que no lee el wasm de los Rust
          # recientes; 0.21 usa 123 y es el mismo build que se prueba en local.
          version: v0.21.14

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/web-ui

      - name: Interfaz
        working-directory: rust/web-ui
        run: trunk build --release --public-url /

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cisne-047/distroforge-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          # el contexto es la raíz porque la imagen copia la UI compilada
          context: .
          file: rust/server-rs/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
