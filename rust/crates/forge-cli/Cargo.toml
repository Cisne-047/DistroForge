[package]
name = "forge-cli"
version = "1.1.1"
edition = "2021"
description = "CLI `forge` de DistroForge: vuelca a disco el proyecto generado (equivalente a scripts/dump.ts)"
license = "MIT OR Apache-2.0"

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
forge-core = { path = "../forge-core" }
serde_json = "1"
