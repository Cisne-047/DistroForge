[package]
name = "forge-core"
version = "1.1.0"
edition = "2021"
description = "Núcleo portable de DistroForge: catálogo, plantillas y generadores de recetas (port fiel del núcleo TypeScript)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Solo para verificar en tests que los workflows generados son YAML válido
# (equivalente al js-yaml de la batería vitest).
serde_yaml = "0.9"
