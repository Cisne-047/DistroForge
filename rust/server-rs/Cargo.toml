[package]
name = "distroforge-server"
version = "1.1.0"
edition = "2021"
description = "Servidor DistroForge en Rust (réplica del backend Node/Fastify)"
license = "MIT"

# Proyecto INDEPENDIENTE: no pertenece al workspace de rust/Cargo.toml.
[workspace]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
scrypt = "0.11"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# El servidor es el artefacto que más importa en producción: LTO y una sola
# unidad de código cuestan unos segundos de build y dan un binario más rápido
# y bastante más pequeño (menos capas que descargar en la imagen).
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
