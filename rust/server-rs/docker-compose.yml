# Levanta el backend con la interfaz incluida: docker compose up --build
#
# El contexto es la raíz del repositorio porque la imagen incluye la UI, así que
# hay que compilarla antes:
#
#   cd rust/web-ui && trunk build --release --public-url /
#   cd rust/server-rs && docker compose up --build
#
# Con la UI en el mismo origen que la API, las cuentas y la galería con sesión
# funcionan (ver docs/DESPLIEGUE.md).

services:
  server:
    build:
      context: ..
      dockerfile: rust/server-rs/Dockerfile
    image: ghcr.io/cisne-047/distroforge-server:latest
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      # SQLite en disco, dentro del volumen: las cuentas y los packs sobreviven
      # a un reinicio del contenedor (por defecto el motor usa :memory:).
      DF_DB_PATH: /data/df.db
      QEMU_BIN: /usr/bin/qemu-system-x86_64
      DF_WEB_DIR: /app/web
    volumes:
      - df-data:/data
    # El Test Drive necesita KVM para ser usable. Descomenta en Linux con KVM
    # (en Docker Desktop para Windows/macOS no existe /dev/kvm):
    # devices:
    #   - /dev/kvm:/dev/kvm
    restart: unless-stopped

volumes:
  df-data:
