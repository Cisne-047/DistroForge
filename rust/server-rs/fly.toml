# Configuración de Fly.io para el backend de DistroForge.
#
#   1) fly launch --no-deploy --copy-config --name distroforge-server   (o edita `app`)
#   2) fly volumes create df_data --size 1
#   3) fly secrets set DF_DB_PATH=/data/df.db   (opcional: ya viene en [env])
#   4) fly deploy
#
# O automático: guarda el token en el repositorio como secreto FLY_API_TOKEN
# (Settings → Secrets and variables → Actions) y empuja un tag v*: el workflow
# deploy-server.yml despliega solo.

app = "distroforge-server"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # SQLite en el volumen: con el valor por defecto (:memory:) las cuentas y los
  # packs desaparecerían en cada reinicio.
  DF_DB_PATH = "/data/df.db"

[http_service]
  internal_port = 8080
  force_https = true
  # Se apaga cuando no hay tráfico: el backend solo hace falta para cuentas,
  # galería compartida y Test Drive.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 100

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[mounts]
  source = "df_data"
  destination = "/data"

# Nota sobre el Test Drive: arranca QEMU dentro del contenedor y necesita KVM,
# que las máquinas compartidas de Fly no ofrecen. El resto de la API funciona
# igual; sin KVM el Test Drive queda deshabilitado (el propio backend responde
# {"available": false} en /api/testdrive/available).
