[package]
name = "forge-tauri"
version = "0.1.0"
edition = "2021"
description = "Scaffold de versión de escritorio de DistroForge (Tauri 2 + forge-core)"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
forge-core = { path = "../../crates/forge-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
