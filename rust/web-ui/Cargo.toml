[package]
name = "web-ui"
version = "0.5.0"
edition = "2021"
description = "UI web de DistroForge en Leptos 0.7 (CSR + WASM), sustituto de la app React"
license = "MIT"

# Proyecto independiente: NO forma parte del workspace rust/Cargo.toml.
[workspace]

[dependencies]
forge-core = { path = "../crates/forge-core" }
leptos = { version = "0.7", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
gloo-file = { version = "0.3", features = ["futures"] }
gloo-net = "0.6"
gloo-timers = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "HtmlAnchorElement",
    "Location",
    "Navigator",
    "Clipboard",
    "Blob",
    "Url",
    "File",
    "FileList",
    "Storage",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
