<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DistroForge — monta tu propia distro</title>
    <meta name="description" content="Constructor de distribuciones Linux: elige base, escritorio, paquetes, repos y sistema, y descarga el proyecto de construcción completo (receta, build.sh y workflow de CI)." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1F7A4C" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link data-trunk rel="copy-file" href="public/styles.css" />
    <link data-trunk rel="copy-file" href="public/favicon.png" />
    <link data-trunk rel="copy-file" href="public/apple-touch-icon.png" />
    <link data-trunk rel="copy-file" href="public/marca-cabeza.png" />
    <!-- fflate 0.8.2 (MIT, https://github.com/101arrowz/fflate) empaquetado en
         local: el ZIP del proyecto se genera también sin conexión, cosa que la
         app de escritorio (Tauri) necesita. -->
    <link data-trunk rel="copy-file" href="public/fflate.js" />
    <!-- La galería comunitaria viaja dentro del bundle: la app la lee en
         `gallery/index.json` (ruta relativa), sin depender de raw.githubusercontent
         ni de que el repositorio sea público. -->
    <link data-trunk rel="copy-dir" href="../../gallery" />
    <link rel="stylesheet" href="styles.css" />
    <script src="fflate.js"></script>
    <script>
      // Genera y descarga el ZIP del proyecto con fflate.
      // Llamado desde Rust (util::download_zip) via wasm-bindgen interop.
      window.distroforgeDownloadZip = function (name, filesJson) {
        var files = JSON.parse(filesJson);
        var data = fflate.zipSync(files, { level: 6 });
        var blob = new Blob([data], { type: "application/zip" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = name + "-distroforge.zip";
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      };
    </script>
  </head>
  <body>
    <noscript>Esta app necesita JavaScript (WASM) activado.</noscript>
    <!-- Declaración canónica de Trunk: compila el crate e inyecta el cargador del
         wasm. Antes había aquí un <script src="src/main.rs"> (forma de
         desarrollo) que Trunk no reemplazaba: se quedaba en el HTML y provocaba
         un 404 en cada carga de la página. -->
    <link data-trunk rel="rust" />
  </body>
</html>
